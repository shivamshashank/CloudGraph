<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudGraph - Authenticate</title>
    <!-- Modern Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }
      .login-card {
        background-color: var(--bg-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: var(--shadow-premium);
        padding: 40px 32px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .login-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.08) 0%,
          transparent 60%
        );
        pointer-events: none;
      }
      .login-logo {
        font-size: 40px;
        margin-bottom: 12px;
        display: inline-block;
        animation: logo-glow 3s infinite alternate;
      }
      @keyframes logo-glow {
        0% {
          filter: drop-shadow(0 0 2px var(--color-primary-glow));
        }
        100% {
          filter: drop-shadow(0 0 12px var(--color-secondary-glow));
        }
      }
      .login-header h2 {
        font-family: var(--font-heading);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(to right, #ffffff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .login-header p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 32px;
      }
      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }
      .form-label {
        display: block;
        font-family: var(--font-heading);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .form-input {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-main);
        font-family: var(--font-body);
        font-size: 14px;
        padding: 12px 16px;
        transition: all 0.3s ease;
      }
      .form-input:focus {
        background-color: rgba(255, 255, 255, 0.06);
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        outline: none;
      }
      .login-btn {
        margin-top: 10px;
        margin-bottom: 16px;
        justify-content: center;
      }
      .login-hint {
        font-size: 12px;
        color: var(--text-muted);
        background-color: rgba(255, 255, 255, 0.02);
        border-radius: 6px;
        padding: 8px 12px;
        border: 1px dashed var(--border-color);
      }
      .error-alert {
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        font-size: 13px;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 20px;
        display: none;
        animation: shake 0.4s ease-in-out;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <span class="login-logo">⚡</span>
        <div class="login-header">
          <h2>Access CloudGraph</h2>
          <p>Sign in to triaging incident workspace</p>
        </div>

        <div id="error-msg" class="error-alert">
          Invalid credentials. Please try again.
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Enter username"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-primary login-btn">
            Authenticate Workspace
          </button>
        </form>

        <div class="login-hint">
          Demo Access Hint: Use <strong>admin</strong> /
          <strong>cloudgraph</strong>
        </div>
      </div>
    </div>

    <script>
      // Clear any stale login session on load
      localStorage.removeItem("cloudgraph_logged_in");

      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const user = document.getElementById("username").value.trim();
          const pass = document.getElementById("password").value.trim();
          const errorMsg = document.getElementById("error-msg");

          if (user === "admin" && pass === "cloudgraph") {
            localStorage.setItem("cloudgraph_logged_in", "true");
            // Redirect to index page
            window.location.href = "index.html";
          } else {
            errorMsg.style.display = "block";
            // Trigger shake animation again if already showing
            errorMsg.style.animation = "none";
            errorMsg.offsetHeight; /* trigger reflow */
            errorMsg.style.animation = "shake 0.4s ease-in-out";
          }
        });
    </script>
  </body>
</html>
