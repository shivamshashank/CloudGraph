# =============================================================================
# CloudGraph — Local Pre-commit Hooks Configuration
# =============================================================================

repos:
  # General file hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files

  # Terraform quality & security checks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--recursive
      - id: terraform_checkov
        args:
          - --args=--config-file=deployments/terraform/.checkov.yaml

  # Local system hooks for Go files
  - repo: local
    hooks:
      - id: go-fmt
        name: Go Format (gofmt)
        entry: gofmt -w
        language: system
        files: \.go$
      - id: go-imports
        name: Go Imports (goimports)
        entry: goimports -w
        language: system
        files: \.go$
      - id: golangci-lint
        name: Go Lint (golangci-lint)
        entry: bash -c 'cd tests/terraform && golangci-lint run ./...'
        language: system
        files: \.go$
        pass_filenames: false
