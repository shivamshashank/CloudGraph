# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # ===================================================================
  # Standard Hooks
  # ===================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deployments/helm/
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # experiments/results/claims.csv is ~720KB: it is the dataset every
        # published number derives from, so it has to be tracked rather than
        # regenerated (regenerating costs ~6h of LLM calls and would not
        # reproduce, the provider exposes no sampling seed).
        args: [--maxkb=1024]
      - id: detect-private-key

  # ===================================================================
  # Go
  # ===================================================================
  - repo: local
    hooks:
      - id: go-vet
        name: go-vet
        entry: bash -c 'go vet ./... && cd tests/observability && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.64.5
    hooks:
      - id: golangci-lint
        entry: bash -c 'golangci-lint run ./... && cd tests/observability && golangci-lint run ./...'
        pass_filenames: false

  # ===================================================================
  # Python
  # ===================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203]

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.2.5
    hooks:
      - id: pylint
        language_version: python3.11
        args:
          - --init-hook=import sys; sys.path.extend(['services/api', 'services/agent-orchestrator', 'services/investigation-engine'])
          - --max-line-length=88
          - --min-similarity-lines=100
        additional_dependencies:
          - fastapi
          - neo4j
          - requests
          - qdrant-client
          - kubernetes
          - pydantic
          - anyio
          - pytest
          - sentence-transformers
          - httpx
          - pandas
          - numpy==2.4.6
          - matplotlib==3.11.1

  # ===================================================================
  # HTML, CSS, JS
  # ===================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [html, css, javascript]

  - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
    rev: v1.1.2
    hooks:
      - id: htmlhint
        args: [--config, .htmlhintrc]

  # ===================================================================
  # Configuration & YAML
  # ===================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"
        exclude: ^deployments/helm/

  # ===================================================================
  # Documentation & Scripts (Markdown, Shell)
  # ===================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
        pass_filenames: true

  # ===================================================================
  # Security
  # ===================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets

ci:
  autofix_commit_msg: "chore(pre-commit): auto-format and fix"
  autoupdate_commit_msg: "chore(pre-commit): update hooks"
