<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 816" width="880" height="816"
     role="img" aria-label="CloudGraph evaluated pipeline. Solid boxes are implemented and exercised by the 36-scenario evaluation: an RCAEval RE2 case is seeded into Neo4j and a scenario-scoped Qdrant collection, retrieved under one of three context conditions, diagnosed by five independent specialists whose outputs are combined by a static weighted vote, split into atomic claims, and judged separately by self-consistency and GPCS. Dashed boxes on the right are planned and not implemented: a cross-agent critique round, held-out threshold calibration, human correctness labels, and a second corpus.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181c"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="816" fill="#ffffff"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">

    <text x="24" y="30" font-size="15" font-weight="600" fill="#14181c">CloudGraph — evaluated pipeline</text>
    <text x="24" y="49" font-size="11.5" fill="#6b7480">solid = implemented and exercised by the 36-scenario evaluation · dashed = planned, not built</text>

    <!-- ================= implemented spine ================= -->
    <g stroke="#14181c" stroke-width="1.3" fill="none">
      <rect x="120" y="70"  width="290" height="48"/>
      <rect x="120" y="152" width="290" height="48"/>
      <rect x="120" y="234" width="290" height="48"/>
      <rect x="120" y="316" width="290" height="60"/>
      <rect x="120" y="410" width="290" height="48"/>
      <rect x="120" y="492" width="290" height="48"/>
      <rect x="24"  y="574" width="180" height="60"/>
      <rect x="228" y="574" width="182" height="60"/>
      <rect x="120" y="668" width="290" height="48"/>
      <rect x="120" y="740" width="290" height="46"/>
    </g>

    <g fill="#14181c">
      <text x="265" y="90"  text-anchor="middle">RCAEval RE2 case</text>
      <text x="265" y="107" text-anchor="middle" fill="#6b7480" font-size="11">metrics + logs, faulted service given</text>

      <text x="265" y="172" text-anchor="middle">seed evidence</text>
      <text x="265" y="189" text-anchor="middle" fill="#6b7480" font-size="11">Neo4j graph · Qdrant evidence_eval</text>

      <text x="265" y="254" text-anchor="middle">retrieval condition</text>
      <text x="265" y="271" text-anchor="middle" fill="#6b7480" font-size="11">none | raw | hybrid — scenario-scoped</text>

      <text x="265" y="337" text-anchor="middle">5 specialists, independent</text>
      <text x="265" y="354" text-anchor="middle" fill="#6b7480" font-size="11">monitoring · log · deployment</text>
      <text x="265" y="369" text-anchor="middle" fill="#6b7480" font-size="11">topology · security</text>

      <text x="265" y="430" text-anchor="middle">static weighted consensus</text>
      <text x="265" y="447" text-anchor="middle" fill="#6b7480" font-size="11">no cross-agent messaging</text>

      <text x="265" y="512" text-anchor="middle">atomic claim extraction</text>
      <text x="265" y="529" text-anchor="middle" fill="#6b7480" font-size="11">one segmentation, both verifiers</text>

      <text x="114" y="596" text-anchor="middle">self-consistency</text>
      <text x="114" y="612" text-anchor="middle" fill="#6b7480" font-size="11">recurrence across</text>
      <text x="114" y="626" text-anchor="middle" fill="#6b7480" font-size="11">3 samples, T=0.8</text>

      <text x="319" y="596" text-anchor="middle">GPCS</text>
      <text x="319" y="612" text-anchor="middle" fill="#6b7480" font-size="10.5">evidence + hop proximity</text>
      <text x="319" y="626" text-anchor="middle" fill="#6b7480" font-size="10.5">0.30 floor · 0.50 cut, fixed</text>

      <text x="265" y="688" text-anchor="middle">per-claim verdicts</text>
      <text x="265" y="705" text-anchor="middle" fill="#6b7480" font-size="11">3,685 claims · 36 scenarios</text>

      <text x="265" y="760" text-anchor="middle">merge · paired bootstrap · figures</text>
      <text x="265" y="776" text-anchor="middle" fill="#6b7480" font-size="11">clustered by scenario, n=36</text>
    </g>

    <g stroke="#14181c" stroke-width="1.3" fill="none" marker-end="url(#a)">
      <line x1="265" y1="118" x2="265" y2="146"/>
      <line x1="265" y1="200" x2="265" y2="228"/>
      <line x1="265" y1="282" x2="265" y2="310"/>
      <line x1="265" y1="376" x2="265" y2="404"/>
      <line x1="265" y1="458" x2="265" y2="486"/>
      <path d="M265,540 L265,558 L114,558 L114,568"/>
      <path d="M265,540 L265,558 L319,558 L319,568"/>
      <path d="M114,634 L114,652 L265,652 L265,662"/>
      <path d="M319,634 L319,652 L265,652 L265,662"/>
      <line x1="265" y1="716" x2="265" y2="734"/>
    </g>

    <!-- ================= planned annexes ================= -->
    <g stroke="#6b7480" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
      <rect x="530" y="70"  width="290" height="48"/>
      <rect x="530" y="316" width="290" height="60"/>
      <rect x="530" y="574" width="290" height="60"/>
      <rect x="530" y="668" width="290" height="48"/>
    </g>

    <g fill="#6b7480">
      <text x="675" y="90"  text-anchor="middle">second corpus — RCAEval RE3</text>
      <text x="675" y="107" text-anchor="middle" font-size="11">out-of-distribution generalisation</text>

      <text x="675" y="337" text-anchor="middle">cross-agent critique round</text>
      <text x="675" y="354" text-anchor="middle" font-size="11">the difference between an ensemble</text>
      <text x="675" y="369" text-anchor="middle" font-size="11">and a collaborating multi-agent system</text>

      <text x="675" y="596" text-anchor="middle">held-out threshold calibration</text>
      <text x="675" y="612" text-anchor="middle" font-size="11">both GPCS cutoffs are hand-set</text>
      <text x="675" y="626" text-anchor="middle" font-size="11">defaults, fitted on nothing</text>

      <text x="675" y="688" text-anchor="middle">human correctness labels</text>
      <text x="675" y="705" text-anchor="middle" font-size="11">without these, agreement is not accuracy</text>
    </g>

    <g stroke="#6b7480" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#ad)">
      <line x1="524" y1="94"  x2="416" y2="94"/>
      <line x1="524" y1="346" x2="416" y2="346"/>
      <line x1="524" y1="604" x2="416" y2="604"/>
      <line x1="524" y1="692" x2="416" y2="692"/>
    </g>

    <text x="24" y="806" font-size="10.5" fill="#6b7480">Task: fault-type diagnosis for a known affected service — not root-cause service localisation.</text>
  </g>
</svg>
