name: Pre-Commit Checks

on:
  pull_request:
    branches: ["**"]

jobs:
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1
