# =============================================================================
# CloudGraph — GitHub Actions CI: Terraform Infrastructure
# Week 2: Automated Terraform Validation Pipeline
#
# Triggers on:
#   - Push to infra/aws-eks-terraform branch
#   - Pull requests targeting main
#
# Jobs:
#   1. validate  — format check, init, validate, tflint, checkov
#   2. plan      — terraform plan with output as PR comment
#   3. test      — Terratest plan-only tests (no real AWS resources)
#
# Note: The 'apply' step is intentionally manual (not automated) to prevent
#       accidental infrastructure changes. Run from local machine.
# =============================================================================

name: Terraform Infrastructure CI

on:
  push:
    branches:
      - infra/aws-eks-terraform
    paths:
      - "deployments/terraform/**"
      - "tests/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deployments/terraform/**"
      - "tests/terraform/**"

# Prevent concurrent runs on the same branch (avoid plan/apply conflicts)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.5"
  TF_DIR: "deployments/terraform"
  GO_VERSION: "1.21"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validate — lint, format, security scan
  # ---------------------------------------------------------------------------
  validate:
    name: "Validate Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Format check — ensures consistent code style
      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive -diff
        # If this fails, run: terraform fmt -recursive

      # Init with a local backend (no AWS credentials needed for validation)
      - name: Terraform Init (local backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      # Validate HCL syntax and references
      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # Install and run TFLint for additional rule enforcement
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: TFLint — init plugins
        working-directory: ${{ env.TF_DIR }}
        run: tflint --init

      - name: TFLint — run
        working-directory: ${{ env.TF_DIR }}
        run: tflint --recursive

  # ---------------------------------------------------------------------------
  # Job 2: Plan — generate and display a Terraform plan
  # Requires AWS credentials stored as GitHub secrets
  # ---------------------------------------------------------------------------
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: validate
    # Only run plan when AWS secrets are available (not on fork PRs)
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write # Required to post plan as PR comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file=../../environments/dev/terraform.tfvars \
            -out=tfplan \
            -no-color \
          2>&1 | tee plan_output.txt
        continue-on-error: true

      # Post plan output as a PR comment for review
      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const output = `## Terraform Plan
            \`\`\`hcl
            ${truncated}
            \`\`\`
            *Workflow: \`${{ github.workflow }}\`, Run: \`${{ github.run_id }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Job 3: Validate Go — check formatting, imports, and linting
  # ---------------------------------------------------------------------------
  go-validate:
    name: "Validate Go"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Format Check
        run: |
          diff -u <(echo -n) <(gofmt -d -s tests/terraform)
          diff -u <(echo -n) <(gofmt -d -s tests/observability)

      - name: Go Imports Check
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          diff -u <(echo -n) <($(go env GOPATH)/bin/goimports -d tests/terraform)
          diff -u <(echo -n) <($(go env GOPATH)/bin/goimports -d tests/observability)

      - name: Go Lint - tests/terraform
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: tests/terraform

      - name: Go Lint - tests/observability
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.55.2
          working-directory: tests/observability

  # ---------------------------------------------------------------------------
  # Job 3.5: Validate Helm Chart
  # ---------------------------------------------------------------------------
  helm-validate:
    name: "Validate Helm"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint deployments/helm/sample-app

  # ---------------------------------------------------------------------------
  # Job 4: Test — run Terratest plan-only tests (no AWS resources created)
  # ---------------------------------------------------------------------------
  test:
    name: "Terratest (plan-only)"
    runs-on: ubuntu-latest
    needs: [validate, go-validate, helm-validate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # Required for Terratest

      - name: Download Go dependencies (terraform)
        working-directory: tests/terraform
        run: go mod download

      - name: Run plan-only Terratest tests
        working-directory: tests/terraform
        # Only run tests that don't create real resources (no AWS creds needed)
        run: go test -v -timeout 15m -run "TestVPCPlanValidation|TestVariableValidation|TestIAMPlanValidation|TestEKSPlanValidation" ./...
        env:
          # Use local backend for plan-only tests
          TF_CLI_ARGS: "-backend=false"

      - name: Download Go dependencies (observability)
        working-directory: tests/observability
        run: go mod download

      - name: Run observability verification tests
        working-directory: tests/observability
        run: go test -v -timeout 5m ./...
