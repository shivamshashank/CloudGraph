name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version
        id: next_version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1 || true)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION_PART=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$VERSION_PART"
            if [ "$major" -eq 0 ]; then
              NEXT_TAG="v1.0.0"
            else
              NEXT_TAG="v${major}.${minor}.$((patch+1))"
            fi
          fi

          echo "next_tag=${NEXT_TAG}" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next_version.outputs.next_tag }}"
          git push origin "${{ steps.next_version.outputs.next_tag }}"

      - name: Package CLI Script
        run: |
          mkdir -p dist
          cp cloudgraph dist/cloudgraph
          # Dynamically set version tag inside the bash script
          TAG_NAME="${{ steps.next_version.outputs.next_tag }}"
          sed -i 's/CLOUDGRAPH_VERSION:-0.1.0/CLOUDGRAPH_VERSION:-'"${TAG_NAME#v}"'/g' dist/cloudgraph

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum cloudgraph > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.next_tag }}
          name: Release ${{ steps.next_version.outputs.next_tag }}
          body: |
            ## 🚀 CloudGraph ${{ steps.next_version.outputs.next_tag }}

            ### Downloads

            - cloudgraph

            SHA256 checksums are provided in `checksums.txt`.
          draft: false
          prerelease: false
          files: |
            dist/cloudgraph
            dist/checksums.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ghcr.io/shivamshashank/cloudgraph-api:latest
            ghcr.io/shivamshashank/cloudgraph-api:${{ steps.next_version.outputs.next_tag }}

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ui
          file: ./services/ui/Dockerfile
          push: true
          tags: |
            ghcr.io/shivamshashank/cloudgraph-ui:latest
            ghcr.io/shivamshashank/cloudgraph-ui:${{ steps.next_version.outputs.next_tag }}

      - name: Build and Push Agent Orchestrator Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-orchestrator
          file: ./services/agent-orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/shivamshashank/cloudgraph-agent-orchestrator:latest
            ghcr.io/shivamshashank/cloudgraph-agent-orchestrator:${{ steps.next_version.outputs.next_tag }}

      - name: Build and Push Investigation Engine Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/investigation-engine
          file: ./services/investigation-engine/Dockerfile
          push: true
          tags: |
            ghcr.io/shivamshashank/cloudgraph-investigation-engine:latest
            ghcr.io/shivamshashank/cloudgraph-investigation-engine:${{ steps.next_version.outputs.next_tag }}
