name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-test:
    name: Build & Test (Go & Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
          cache-dependency-path: tests/observability/go.sum

      - name: Download Go Dependencies
        run: |
          cd tests/observability && go mod download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt

      - name: Run Go Unit Tests
        run: |
          # Run CLI Go tests (in root module)
          go test -v -race -coverprofile=cli-coverage.out -covermode=atomic ./...
          # Run observability Go tests
          cd tests/observability
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Python Unit Tests
        run: |
          # -n auto: measured ~45% wall-clock reduction on this suite locally
          # (32min -> 17.7min) — real, not theoretical, given CI runners bill
          # by the minute.
          PYTHONPATH=services/api python -m pytest services/api/tests -n auto --cov=services/api/app --cov-report=xml:services/api/coverage.xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli-coverage.out,tests/observability/coverage.out,services/api/coverage.xml
          flags: unittests
