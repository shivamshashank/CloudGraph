name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (Go 1.23)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
          cache-dependency-path: |
            tests/terraform/go.sum
            tests/observability/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false # Required for Terratest

      - name: Download Go Dependencies
        run: |
          cd tests/terraform && go mod download
          cd ../observability && go mod download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Go Unit Tests
        run: |
          cd tests/terraform
          go test -v -race -coverprofile=coverage.out -covermode=atomic -run "PlanValidation|Validation" ./...
          cd ../observability
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Python Unit Tests
        run: |
          PYTHONPATH=backend python -m pytest backend/tests --cov=backend/app --cov-report=xml:backend/coverage.xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/terraform/coverage.out,tests/observability/coverage.out,backend/coverage.xml
          flags: unittests
