{{- if .Values.cloudgraphUI.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudgraph-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.cloudgraphUI.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudgraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "cloudgraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.cloudgraphUI.image.repository }}:{{ .Values.cloudgraphUI.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cloudgraphUI.service.targetPort }}
              protocol: TCP
          env:
            - name: REACT_APP_API_URL
              value: "http://cloudgraph-api.{{ .Values.global.namespace }}.svc.cluster.local:8080"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudgraph-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.cloudgraphUI.service.type }}
  ports:
    - port: {{ .Values.cloudgraphUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.cloudgraphUI.service.type "NodePort") .Values.cloudgraphUI.service.nodePort }}
      nodePort: {{ .Values.cloudgraphUI.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cloudgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- if .Values.cloudgraphUI.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudgraph-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.cloudgraphUI.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.cloudgraphUI.ingress.className }}
  ingressClassName: {{ .Values.cloudgraphUI.ingress.className }}
  {{- end }}
  {{- with .Values.cloudgraphUI.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudgraph-api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: cloudgraph-api
                port:
                  number: 8080
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: cloudgraph-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudgraph-ui
                port:
                  number: {{ .Values.cloudgraphUI.service.port }}
{{- end }}
{{- end }}
