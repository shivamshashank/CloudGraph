{{- if .Values.rbac.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
---
{{- range .Values.rbac.clusterRoles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .name }}
  labels:
    {{- include "cloudgraph.labels" $ | nindent 4 }}
rules:
  {{- toYaml .rules | nindent 2 }}
---
{{- end }}
{{- end }}
