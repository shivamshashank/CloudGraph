{{- if .Values.cloudgraphApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudgraph-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudgraph-api
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudgraph-discovery
subjects:
  - kind: ServiceAccount
    name: cloudgraph-api
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudgraph-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.cloudgraphApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudgraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "cloudgraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: cloudgraph-api
      containers:
        - name: api
          image: "{{ .Values.cloudgraphApi.image.repository }}:{{ .Values.cloudgraphApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cloudgraphApi.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.cloudgraphApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: NEO4J_HOST
              value: "cloudgraph.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: cloudgraph-neo4j-auth
                  key: NEO4J_AUTH
            - name: QDRANT_HOST
              value: "cloudgraph-qdrant.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: AGENT_ORCHESTRATOR_URL
              value: "http://cloudgraph-agent-orchestrator.{{ .Values.global.namespace }}.svc.cluster.local:8082"
            - name: LLM_MODEL
              value: {{ .Values.global.llmModel | quote }}
          resources:
            {{- toYaml .Values.cloudgraphApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            # A real 25-scenario report run does substantial synchronous
            # work in-process (real Neo4j graph traversal, real LLM claim
            # extraction, growing in-memory accumulator state) — the
            # default 1s probe timeout was verified live to be too tight
            # under that real load, causing kubelet to SIGKILL the pod
            # mid-run and silently discard all in-memory report progress
            # (report_runner.py's job state is intentionally in-memory
            # only, so a kill mid-run is unrecoverable, not just a blip).
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudgraph-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.cloudgraphApi.service.type }}
  ports:
    - port: {{ .Values.cloudgraphApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
