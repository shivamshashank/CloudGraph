{{- if .Values.agentOrchestrator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-orchestrator
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudgraph-discovery
subjects:
  - kind: ServiceAccount
    name: agent-orchestrator
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-orchestrator
spec:
  replicas: {{ .Values.agentOrchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudgraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-orchestrator
  template:
    metadata:
      labels:
        {{- include "cloudgraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-orchestrator
    spec:
      serviceAccountName: agent-orchestrator
      containers:
        - name: orchestrator
          image: "{{ .Values.agentOrchestrator.image.repository }}:{{ .Values.agentOrchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NEO4J_HOST
              value: "cloudgraph.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: cloudgraph-neo4j-auth
                  key: NEO4J_AUTH
            - name: REDIS_HOST
              value: "cloudgraph-redis-master.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: QDRANT_HOST
              value: "cloudgraph-qdrant.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: PORT
              value: "8082"
            - name: INVESTIGATION_ENGINE_URL
              value: "http://cloudgraph-investigation-engine.{{ .Values.global.namespace }}.svc.cluster.local:8081"
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          resources:
            {{- toYaml .Values.agentOrchestrator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudgraph-agent-orchestrator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-orchestrator
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-orchestrator
{{- end }}
