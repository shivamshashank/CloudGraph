{{- if .Values.investigationEngine.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: investigation-engine
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: investigation-engine
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudgraph-discovery
subjects:
  - kind: ServiceAccount
    name: investigation-engine
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-engine
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: investigation-engine
spec:
  replicas: {{ .Values.investigationEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudgraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: investigation-engine
  template:
    metadata:
      labels:
        {{- include "cloudgraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: investigation-engine
    spec:
      serviceAccountName: investigation-engine
      containers:
        - name: engine
          image: "{{ .Values.investigationEngine.image.repository }}:{{ .Values.investigationEngine.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            {{- range $key, $value := .Values.investigationEngine.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: NEO4J_HOST
              value: "cloudgraph.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: cloudgraph-neo4j-auth
                  key: NEO4J_AUTH
            - name: QDRANT_HOST
              value: "cloudgraph-qdrant.{{ .Values.global.namespace }}.svc.cluster.local"
            - name: PORT
              value: "8081"
            - name: OPENAI_API_KEY
              value: {{ .Values.global.openaiApiKey | quote }}
            - name: LLM_MODEL
              value: {{ .Values.global.llmModel | quote }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          resources:
            {{- toYaml .Values.investigationEngine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudgraph-investigation-engine
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: investigation-engine
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: investigation-engine
{{- end }}
