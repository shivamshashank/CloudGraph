{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudgraph-ollama-data
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  # Fixed at 1 replica — models are pulled into the PVC by name via
  # `cloudgraph deploy llm`'s `kubectl exec`, and a ReadWriteOnce PVC can
  # only be attached to one pod at a time anyway.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cloudgraph.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "cloudgraph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: cloudgraph-ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: cloudgraph-ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cloudgraph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
