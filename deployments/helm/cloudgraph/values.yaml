# CloudGraph Helm Values
# Configure CloudGraph and its dependencies

# Global settings
global:
  namespace: cloudgraph-system
  imagePullPolicy: IfNotPresent

# CloudGraph API
cloudgraphApi:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-api
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  env:
    ENVIRONMENT: production
    LOG_LEVEL: info

# Investigation Engine
investigationEngine:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-investigation-engine
    tag: "latest"

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  env:
    LOG_LEVEL: info

# Agent Orchestrator
agentOrchestrator:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-agent-orchestrator
    tag: "latest"

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# CloudGraph UI
cloudgraphUI:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-ui
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: cloudgraph.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# OpenTelemetry Collector
otelCollector:
  enabled: true
  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.104.0"

  service:
    type: ClusterIP
    ports:
      grpc: 4317
      http: 4318
      prometheus: 8889

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 400Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-apiservers
              kubernetes_sd_configs:
                - role: endpoints
    processors:
      batch:
        send_batch_size: 1024
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
      logging:
        loglevel: debug
    service:
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging]

neo4j:
  enabled: true
  acceptLicenseAgreement: "yes"
  neo4jPassword: "changeme"
  neo4j:
    name: "cloudgraph-neo4j"

  volumes:
    data:
      mode: defaultStorageClass
      size: 10Gi

  resources:
    cpu: "1000m"
    memory: "2Gi"

# Redis - Cache & Message Queue
redis:
  enabled: true

  auth:
    enabled: false

  master:
    persistence:
      enabled: true
      size: 5Gi

  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 5Gi

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Qdrant - Vector Database
qdrant:
  enabled: true

  persistence:
    enabled: true
    size: 20Gi

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# RBAC Configuration
rbac:
  create: true

  clusterRoles:
    - name: cloudgraph-discovery
      rules:
        - apiGroups: [""]
          resources:
            - nodes
            - namespaces
            - pods
            - services
            - endpoints
            - configmaps
            - secrets
            - persistentvolumes
            - persistentvolumeclaims
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            - deployments
            - statefulsets
            - daemonsets
            - replicasets
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources:
            - jobs
            - cronjobs
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources:
            - events
          verbs: ["get", "list", "watch"]

# Custom Resource Definitions
crds:
  enabled: true

# Observability Stack (optional - install if not already present)
observabilityStack:
  enabled: false  # Set to true to install Prometheus, Grafana, or Loki

  prometheus:
    enabled: false

  grafana:
    enabled: false

  loki:
    enabled: false

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

# Pod Security
podSecurityPolicy:
  enabled: false

# Network Policy
networkPolicy:
  enabled: false
