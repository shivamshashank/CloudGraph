# CloudGraph Helm Values
# Configure CloudGraph and its dependencies

# Global settings
global:
  namespace: cloudgraph-system
  imagePullPolicy: IfNotPresent
  # Optional override for the default model name each service falls back
  # to if a request doesn't specify one. Provider/model selection normally
  # happens via the Settings page (POST /api/v1/settings, stored in
  # Neo4j) — this is just a fallback.
  llmModel: ""

# CloudGraph API
cloudgraphApi:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-api
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    # Bumped from 500m/1Gi after a real 25-scenario report run crashed
    # this pod partway through — verified live via kubectl describe
    # (exitCode 137, liveness probe timeout), not a hypothetical margin.
    # This service now does substantial real synchronous work per claim
    # (LLM extraction calls, graph traversal) that it wasn't doing before
    # the GPCS fixes earlier this session.
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 256Mi

  env:
    ENVIRONMENT: production
    LOG_LEVEL: info

# Investigation Engine
investigationEngine:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-investigation-engine
    tag: "latest"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi

  env:
    LOG_LEVEL: info

# Agent Orchestrator
agentOrchestrator:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-agent-orchestrator
    tag: "latest"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi

# CloudGraph UI
cloudgraphUI:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/shivamshashank/cloudgraph-ui
    tag: "latest"

  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30000

  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts: []
    tls: []

# OpenTelemetry Collector
otelCollector:
  enabled: true
  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.104.0"

  service:
    type: ClusterIP
    ports:
      grpc: 4317
      http: 4318
      prometheus: 8889

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-apiservers
              kubernetes_sd_configs:
                - role: endpoints
    processors:
      batch:
        send_batch_size: 1024
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
      logging:
        loglevel: debug
      otlphttp/cloudgraph-traces:
        endpoint: http://cloudgraph-api:8080/api/v1/telemetry/traces
      otlphttp/cloudgraph-metrics:
        endpoint: http://cloudgraph-api:8080/api/v1/telemetry/metrics
      otlphttp/cloudgraph-logs:
        endpoint: http://cloudgraph-api:8080/api/v1/telemetry/logs
    service:
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus, logging, otlphttp/cloudgraph-metrics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging, otlphttp/cloudgraph-logs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging, otlphttp/cloudgraph-traces]

neo4j:
  enabled: true
  acceptLicenseAgreement: "yes"
  password: ""
  neo4j:
    name: "cloudgraph-neo4j"

  volumes:
    data:
      mode: defaultStorageClass
      size: 10Gi

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "10m"
      memory: "512Mi"

# Qdrant - Vector Database
qdrant:
  enabled: true

  persistence:
    enabled: true
    size: 20Gi

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 128Mi

# RBAC Configuration
rbac:
  create: true

  clusterRoles:
    - name: cloudgraph-discovery
      rules:
        - apiGroups: [""]
          resources:
            - nodes
            - namespaces
            - pods
            - services
            - endpoints
            - configmaps
            - secrets
            - persistentvolumes
            - persistentvolumeclaims
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            - deployments
            - statefulsets
            - daemonsets
            - replicasets
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources:
            - jobs
            - cronjobs
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources:
            - events
          verbs: ["get", "list", "watch"]

# Observability Stack (optional - install if not already present)
observabilityStack:
  enabled: false # Set to true to install Prometheus, Grafana, or Loki

  prometheus:
    enabled: false

  grafana:
    enabled: false

  loki:
    enabled: false

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

# Pod Security
podSecurityPolicy:
  enabled: false

# Network Policy
networkPolicy:
  enabled: false
