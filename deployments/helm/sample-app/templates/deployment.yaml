apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.checkout.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.checkout.name }}
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.checkout.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.checkout.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.checkout.name }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.checkout.port | quote }}
    spec:
      containers:
        - name: checkout
          image: "{{ .Values.checkout.image.repository }}:{{ .Values.checkout.image.tag }}"
          imagePullPolicy: {{ .Values.checkout.image.pullPolicy }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otelCollectorEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.checkout.name | quote }}
          ports:
            - containerPort: {{ .Values.checkout.port }}
              name: http
---
